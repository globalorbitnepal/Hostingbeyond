name: Deploy HostingBeyond

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostingbeyond-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

  deploy:
    name: Deploy to VPS
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm SSH secrets exist
        id: ssh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ] || [ -z "${VPS_SSH_KEY}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VPS SSH secrets are not configured, so deploy is skipped."
            echo "Typecheck already passed. Add GitHub Actions secrets VPS_HOST, VPS_USER, VPS_SSH_KEY (and optional VPS_PORT) to enable live deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets are present"
          fi

      - name: Deploy HostingBeyond to VPS
        if: steps.ssh.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "==> Deploying HostingBeyond"
            echo "==> Target: /srv/apps/hostingbeyond"
            echo "==> PM2 user/process: hostingbeyond"
            echo "==> Port: 3000"

            cd /srv/apps/hostingbeyond
            test "$(pwd)" = "/srv/apps/hostingbeyond"

            echo "==> Syncing origin/main (preserve .env and uploads)"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd -e .env -e .env.local -e .env.production -e public/uploads -e data/uploads -e node_modules

            if [ ! -f .env ]; then
              echo "ENV_MISSING: /srv/apps/hostingbeyond/.env is required on the server"
              exit 1
            fi
            echo "ENV_PRESENT"

            echo "==> Installing dependencies"
            npm install

            echo "==> Prisma generate"
            npx prisma generate

            echo "==> Prisma migrate deploy (additive only)"
            npx prisma migrate deploy || echo "MIGRATE_WARNING_CONTINUING"

            echo "==> Building production bundle"
            npm run build

            echo "==> Restarting ONLY HostingBeyond PM2"
            sudo -n -u hostingbeyond -H /usr/local/sbin/hostingbeyond-ctl restart
            sudo -n -u hostingbeyond -H /usr/local/sbin/hostingbeyond-ctl status

            echo "==> HostingBeyond deploy completed"

      - name: Verify live site
        if: steps.ssh.outputs.skip != 'true'
        run: |
          set -euo pipefail

          echo "==> Verifying https://hosting.theglobalorbit.com"
          sleep 5
          HTTP_CODE="$(curl -fsS -o /tmp/hostingbeyond-verify.html -w "%{http_code}" --retry 8 --retry-delay 3 --retry-all-errors https://hosting.theglobalorbit.com/)"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment verification failed: expected HTTP 200, got ${HTTP_CODE}"
            exit 1
          fi

          if ! grep -qi "HostingBeyond\|Host Your Ideas\|hb-solutions-heading" /tmp/hostingbeyond-verify.html; then
            echo "Deployment verification failed: expected homepage content was not found"
            exit 1
          fi

          echo "==> Verification passed (HTTP ${HTTP_CODE})"
