name: Deploy HostingBeyond

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostingbeyond-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: hb-next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            hb-next-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build (CI)
        env:
          CI: "true"
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostingbeyond-next-build
          path: .next
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to VPS
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download production build from Typecheck job
        uses: actions/download-artifact@v4
        with:
          name: hostingbeyond-next-build
          path: ${{ runner.temp }}/next-artifact

      - name: Production migrate deploy gate (fail closed)
        env:
          MIGRATE_SECRET: ${{ secrets.HOSTINGBEYOND_PRODUCTION_MIGRATE_APPROVED }}
        run: |
          set -euo pipefail
          RUN_MIGRATE=0
          if [ "${MIGRATE_SECRET:-}" = "true" ]; then
            RUN_MIGRATE=1
            echo "Migrate enabled via HOSTINGBEYOND_PRODUCTION_MIGRATE_APPROVED repository secret (owner only)."
          else
            echo "MIGRATE_SKIPPED: prisma migrate deploy will NOT run (fail closed)."
            echo "Workflow inputs cannot enable migrations. Set repository secret HOSTINGBEYOND_PRODUCTION_MIGRATE_APPROVED=true only after docs/MIGRATION-HISTORY-REPAIR.md preflight passes."
          fi
          echo "RUN_PRISMA_MIGRATE_DEPLOY=${RUN_MIGRATE}" >> "${GITHUB_ENV}"

      - name: Confirm SSH secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VPS_HOST}" ]; then echo "Missing GitHub secret: VPS_HOST"; missing=1; fi
          if [ -z "${VPS_USER}" ]; then echo "Missing GitHub secret: VPS_USER"; missing=1; fi
          if [ -z "${VPS_SSH_KEY}" ]; then echo "Missing GitHub secret: VPS_SSH_KEY"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Add VPS_HOST, VPS_USER, VPS_SSH_KEY, and optional VPS_PORT in GitHub repository Settings > Secrets and variables > Actions."
            echo "Do not put those values in the workflow file."
            exit 1
          fi

          python3 - <<'PY'
          import os, re, sys

          def fail(msg: str) -> None:
              print(msg)
              sys.exit(1)

          host = os.environ.get("VPS_HOST", "").strip()
          user = os.environ.get("VPS_USER", "").strip()
          port = os.environ.get("VPS_PORT", "").strip() or "22"
          key = os.environ.get("VPS_SSH_KEY", "")

          if host != "51.15.21.166":
              fail("SSH_IDENTITY_FAIL: VPS_HOST must be the HostingBeyond production IPv4 address")
          if "@" in host:
              fail("SSH_IDENTITY_FAIL: VPS_HOST must be an IP/hostname only, not user@host")
          if user != "hostingbeyond":
              fail("SSH_IDENTITY_FAIL: VPS_USER must be exactly hostingbeyond (no extra whitespace)")
          if port != "22":
              fail("SSH_IDENTITY_FAIL: VPS_PORT must be 22")

          raw = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2 and "BEGIN" in raw and "END" in raw:
              raw = re.sub(r"[ \t]+", "\n", raw)
          if not raw.endswith("\n"):
              raw += "\n"

          if "BEGIN" not in raw or "PRIVATE KEY" not in raw or "END" not in raw:
              fail("SSH_KEY_FAIL: VPS_SSH_KEY is not a PEM/OpenSSH private key (missing BEGIN/END PRIVATE KEY)")
          if "Proc-Type: 4,ENCRYPTED" in raw:
              fail("SSH_KEY_FAIL: VPS_SSH_KEY is encrypted; use an unencrypted deploy key (do not put a passphrase key in Actions)")

          print("SSH preflight passed: identity and key shape OK")
          PY

      - name: Deploy HostingBeyond to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOMAIN_API_LIVE_KEY: ${{ secrets.DOMAIN_API_LIVE_KEY }}
          RUN_PRISMA_MIGRATE_DEPLOY: ${{ env.RUN_PRISMA_MIGRATE_DEPLOY }}
        run: |
          set -euo pipefail
          export KEY_FILE="${RUNNER_TEMP}/hostingbeyond_gha_ssh_key"
          trap 'rm -f -- "$KEY_FILE"' EXIT INT TERM ERR
          python3 - <<'PY'
          import os, pathlib, re
          key = os.environ["VPS_SSH_KEY"]
          raw = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if raw.count("\n") < 2 and "\\n" in raw:
              raw = raw.replace("\\n", "\n")
          if raw.count("\n") < 2 and "BEGIN" in raw and "END" in raw:
              raw = re.sub(r"[ \t]+", "\n", raw)
          if not raw.endswith("\n"):
              raw += "\n"
          path = pathlib.Path(os.environ["KEY_FILE"])
          path.write_text(raw)
          path.chmod(0o600)
          PY
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          ssh-keyscan -4 -p "${VPS_PORT:-22}" -T 10 "${VPS_HOST}" >> "${HOME}/.ssh/known_hosts"
          SSH=(ssh -4 -i "${KEY_FILE}" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}")

          if [ -n "${DOMAIN_API_LIVE_KEY:-}" ]; then
            echo "==> Staging live availability sync for VPS (value not logged)"
            python3 - <<PY | "${SSH[@]}" "cat > /tmp/hb-domain-availability.sync"
          import json, os
          print(json.dumps({"liveKey": os.environ["DOMAIN_API_LIVE_KEY"]}))
          PY
          else
            echo "DOMAIN_API_LIVE_KEY secret not set; VPS must already have live availability in .env or search stays unconfigured"
          fi

          NEXT_ARTIFACT="${RUNNER_TEMP}/next-artifact/.next"
          if [ ! -d "${NEXT_ARTIFACT}" ]; then
            echo "BUILD_ARTIFACT_MISSING: expected ${NEXT_ARTIFACT}"
            exit 1
          fi
          echo "==> Uploading CI-built .next to VPS (skip server-side next build)"
          tar -C "${RUNNER_TEMP}/next-artifact" -czf "${RUNNER_TEMP}/hb-next.tgz" .next
          "${SSH[@]}" "cat > /tmp/hb-next.tgz" < "${RUNNER_TEMP}/hb-next.tgz"

          REMOTE_SCRIPT="/tmp/hostingbeyond-gha-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          echo "==> Uploading remote deploy script"
          "${SSH[@]}" "printf '%s\\n' '#!/bin/bash' 'set -euo pipefail' 'export RUN_PRISMA_MIGRATE_DEPLOY=${RUN_PRISMA_MIGRATE_DEPLOY:-0}' > '${REMOTE_SCRIPT}'"
          "${SSH[@]}" "cat >> '${REMOTE_SCRIPT}'" <<'REMOTE'
          # Keep the GitHub SSH channel quiet except for heartbeats. Next.js
          # stdout on bash -s previously caused the client to close (~64s).
          exec 3>&1
          exec > >(grep -viE "password|secret|token|database_url|begin |cookie|private key|environment" >&3) 2>&1
          heartbeat() {
            while true; do
              echo "[deploy-heartbeat] $(date -u +%Y-%m-%dT%H:%M:%SZ)" >&3
              sleep 15
            done
          }
          heartbeat &
          HEARTBEAT_PID=$!
          trap 'kill "$HEARTBEAT_PID" 2>/dev/null || true; rm -f -- "$0"' EXIT

          echo "==> Validating SSH user"
          test "$(id -un)" = "hostingbeyond"

          echo "==> Deploying HostingBeyond"
          echo "==> Target: /srv/apps/hostingbeyond"
          echo "==> PM2 wrapper: /usr/local/sbin/hostingbeyond-ctl"
          echo "==> PM2_HOME: /home/hostingbeyond/.pm2"
          echo "==> Port: 3030"

          cd /srv/apps/hostingbeyond
          test "$(pwd)" = "/srv/apps/hostingbeyond"

          echo "==> Validating Git remote and branch"
          test "$(git remote get-url origin)" = "git@github.com:globalorbitnepal/Hostingbeyond.git"

          echo "==> Confirming existing PM2 process hostingbeyond"
          test -x /usr/local/sbin/hostingbeyond-ctl
          test -d /home/hostingbeyond/.pm2

          echo "==> Syncing origin/main (preserve .env and runtime uploads)"
          git fetch origin main
          git checkout main
          test "$(git branch --show-current)" = "main"
          git reset --hard origin/main
          git clean -fd \
            -e .env \
            -e .env.local \
            -e .env.production \
            -e public/uploads \
            -e data/uploads \
            -e data/hostingbeyond \
            -e node_modules \
            -e .deploy-package-lock-sha

          if [ ! -f .env ]; then
            echo "ENV_MISSING: /srv/apps/hostingbeyond/.env is required on the server"
            exit 1
          fi
          echo "ENV_PRESENT"

          AVAIL_SYNC=/tmp/hb-domain-availability.sync
          if [ -f "$AVAIL_SYNC" ]; then
            echo "==> Merging live domain availability credentials"
            node scripts/merge-domain-availability-env.mjs .env < "$AVAIL_SYNC"
            rm -f "$AVAIL_SYNC" 2>/dev/null || true
          fi
          if ! grep -q '^DOMAIN_API_LIVE_KEY=.' .env 2>/dev/null; then
            echo "LIVE_AVAILABILITY_WARN: DOMAIN_API_LIVE_KEY missing — public search may return lookup_unconfigured"
          else
            echo "DOMAIN_API_LIVE_KEY=CONFIGURED"
            grep -q '^DOMAIN_AVAILABILITY_ENV=live' .env || echo 'DOMAIN_AVAILABILITY_ENV="live"' >> .env
          fi

          LOCK_SHA="$(sha256sum package-lock.json | awk '{print $1}')"
          if [ -f .deploy-package-lock-sha ] && [ "$(cat .deploy-package-lock-sha)" = "${LOCK_SHA}" ]; then
            echo "SKIP npm ci — package-lock.json unchanged"
          else
            echo "==> Installing dependencies (lockfile changed)"
            npm ci --no-audit --no-fund </dev/null
            echo "${LOCK_SHA}" > .deploy-package-lock-sha
          fi
          npx prisma generate </dev/null

          if [ "${RUN_PRISMA_MIGRATE_DEPLOY}" = "1" ]; then
            echo "==> Applying database migrations (owner-approved)"
            npx prisma migrate deploy </dev/null
          else
            echo "==> SKIP prisma migrate deploy (fail-closed gate; code deploy continues)"
          fi

          echo "==> Installing CI-built Next.js output"
          test -f /tmp/hb-next.tgz
          rm -rf .next
          tar xzf /tmp/hb-next.tgz -C .
          rm -f /tmp/hb-next.tgz

          echo "==> Allowing the runtime user to write the Next cache"
          mkdir -p .next/cache/images .next/cache/fetch-cache
          # Only the top level dirs; entries inside belong to the runtime user.
          chmod 0777 .next/cache .next/cache/images .next/cache/fetch-cache 2>/dev/null || true

          echo "==> Restarting ONLY existing HostingBeyond PM2 process"
          /usr/local/sbin/hostingbeyond-ctl restart

          echo "==> Verifying process owner hostingbeyond"
          PROCESS_OK=0
          for _i in $(seq 1 20); do
            if pgrep -u hostingbeyond -a node >/dev/null 2>&1; then
              PROCESS_OK=1
              break
            fi
            sleep 1
          done
          if [ "$PROCESS_OK" != "1" ]; then
            echo "PROCESS_USER_FAIL: no node process owned by hostingbeyond after wait"
            exit 1
          fi

          echo "==> Verifying listener on port 3030"
          LISTEN_OK=0
          for _i in $(seq 1 15); do
            if command -v ss >/dev/null 2>&1 && ss -lnt | grep -Eq ':3030([[:space:]]|$)'; then
              LISTEN_OK=1
              break
            fi
            sleep 1
          done
          if [ "$LISTEN_OK" != "1" ]; then
            echo "LISTEN_FAIL: nothing listening on TCP port 3030 after restart wait"
            ss -lnt || true
            exit 1
          fi

          echo "==> Verifying local HTTP on 127.0.0.1:3030"
          LOCAL_CODE="$(curl -fsS -o /dev/null -w "%{http_code}" --retry 4 --retry-delay 1 --retry-all-errors --max-time 15 http://127.0.0.1:3030/ || true)"
          if [ "$LOCAL_CODE" != "200" ]; then
            echo "Local verify failed: expected HTTP 200 on 127.0.0.1:3030, got ${LOCAL_CODE:-none}"
            exit 1
          fi

          echo "==> HostingBeyond deploy completed"
          REMOTE

          "${SSH[@]}" "chmod 700 '${REMOTE_SCRIPT}'"
          echo "==> Running remote deploy script"
          set +e
          "${SSH[@]}" "bash '${REMOTE_SCRIPT}'"
          REMOTE_STATUS=$?
          set -e
          if [ "$REMOTE_STATUS" -ne 0 ]; then
            echo "REMOTE_DEPLOY_FAIL: exit ${REMOTE_STATUS}"
            exit "$REMOTE_STATUS"
          fi
          echo "==> HostingBeyond remote deploy succeeded"

      - name: Verify live site
        run: |
          set -euo pipefail

          echo "==> Verifying https://hosting.theglobalorbit.com"
          HTTP_CODE="$(curl -fsS -o /tmp/hostingbeyond-verify.html -w "%{http_code}" --retry 3 --retry-delay 1 --retry-all-errors --max-time 20 https://hosting.theglobalorbit.com/)"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment verification failed: expected HTTP 200, got ${HTTP_CODE}"
            exit 1
          fi

          if ! grep -qi "HostingBeyond\|Host Your Ideas\|hb-solutions-heading" /tmp/hostingbeyond-verify.html; then
            echo "Deployment verification failed: expected homepage content was not found"
            exit 1
          fi

          echo "==> Verification passed (HTTP ${HTTP_CODE})"
