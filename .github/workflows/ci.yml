name: HostingBeyond CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-hostingbeyond-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Ephemeral CI database only — not production, not repository secrets.
  DATABASE_URL: postgresql://hb_ci:hb_ci_test_only@127.0.0.1:5432/hostingbeyond_integration_test?schema=public

jobs:
  quality:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hb_ci
          POSTGRES_PASSWORD: hb_ci_test_only
          POSTGRES_DB: hostingbeyond_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hb_ci -d hostingbeyond_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Unit tests use git merge-base (Windows backup preflight); default depth-1 PR checkouts omit ancestors.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assert integration database target
        run: node scripts/ci-assert-integration-database.mjs

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations (integration DB only)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          INTEGRATION_TESTS: required
        run: npm run test

      - name: Production build
        env:
          CI: "true"
        run: npm run build
